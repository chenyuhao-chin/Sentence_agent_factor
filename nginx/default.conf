# ============================================================
# Agent Factory — Nginx 反代配置
# 核心任务：抹平一切云平台代理兼容问题
# 初级开发者无需理解此文件，docker compose up 即用
# ============================================================

upstream streamlit_backend {
    server streamlit:8501;
    # 保持长连接，避免 WebSocket 频繁断开
    keepalive 32;
}

server {
    listen 8080;

    # 允许上传大文件（ZIP 交付包等）
    client_max_body_size 200M;

    # 基础代理
    location / {
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;

        # === WebSocket 支持（Streamlit 核心依赖） ===
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # === 透传关键头 ===
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === 关键：禁用缓冲以支持 SSE/Streaming ===
        # Streamlit 重度依赖 Server-Sent Events，缓冲会导致 502
        proxy_buffering off;
        proxy_cache off;

        # === 超时设置：避免长时间无响应被切断 ===
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # === WebSocket 专用路由：Streamlit 的 _stcore/stream ===
    location /_stcore/stream {
        proxy_pass http://streamlit_backend/_stcore/stream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 需要更长的超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # === 健康检查端点 ===
    location /_stcore/health {
        proxy_pass http://streamlit_backend/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # === 静态资源：直接走 Streamlit ===
    location /_stcore/ {
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
