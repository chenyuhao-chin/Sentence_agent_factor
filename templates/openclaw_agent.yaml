# OpenClaw Agent 接入配置模板
# OpenClaw 是连接 IM 平台（微信/飞书/钉钉）到 Agent 的网关
# 将此配置提供给 OpenClaw 部署方，即可将 Agent Factory 生成的 Agent 接入各个 IM 渠道

agent_id: "${AGENT_NAME}"               # 由 builder.py 替换为 agent_config.agent_name
version: "1.0"
description: "由 Agent Factory 生成的 ${AGENT_NAME} Agent"

# ========== LLM 后端配置 ==========
# 兼容所有 OpenAI SDK 兼容接口（DeepSeek / 通义千问 / 智谱GLM / 小米MiMo / Claude 中转 / 本地 vLLM 等）
# 只需修改 base_url / model / api_key 即可切换任意模型
llm:
  provider: "openai_compatible"          # 兼容所有 OpenAI SDK 的后端
  model: "${LLM_MODEL}"                  # 由用户运行时设置（如 deepseek-chat / qwen-plus / glm-4 等）
  api_key: "${LLM_API_KEY}"              # 对应模型平台的 API Key
  base_url: "${LLM_BASE_URL}"            # 对应模型平台的 API 地址（含 /v1）
  temperature: 0.7
  max_tokens: 4096

# ========== 系统提示词 ==========
system_prompt: |
  ${SYSTEM_PROMPT_PLACEHOLDER}           # 由 builder.py 替换为 agent_config.system_prompt

# ========== 工作流配置 ==========
workflow:
  mode: "sequential"                     # sequential（顺序执行）/ conditional（条件分支）/ parallel（并行）
  steps: ${WORKFLOW_STEPS_PLACEHOLDER}    # 由 builder.py 从 agent_config.workflow_steps 生成

  # 全局门禁 ================================================================
  global_gate:                           # 所有步骤的全局质量门禁
    enabled: true
    max_retries: 2                       # 每步失败最大重试次数
    on_step_failure: "retry"             # retry / skip / abort
    on_global_failure: "partial_output"  # partial_output / abort / fallback

  # 上下文传递 ================================================================
  context_policy:
    mode: "cumulative"                   # cumulative（累积）/ step_only（仅上一步）/ none（无上下文）
    max_context_tokens: 8000

# ========== 渠道集成 ==========
# OpenClaw 官方渠道配置格式（camelCase 字段名）
# 飞书使用 WebSocket 长连接模式，无需公网 IP、无需回调地址
channels:
  feishu:                                # 飞书机器人（WebSocket 长连接）
    enabled: true                        # 默认启用，导入即用
    appId: "${FEISHU_APP_ID}"            # 飞书开放平台 → 应用凭证 → App ID
    appSecret: "${FEISHU_APP_SECRET}"    # 飞书开放平台 → 应用凭证 → App Secret
    verificationToken: "${FEISHU_VERIFICATION_TOKEN}"  # 事件订阅 → Verification Token
    encryptKey: "${FEISHU_ENCRYPT_KEY}"  # 事件订阅 → Encrypt Key（可留空）
    connectionMode: "websocket"          # websocket 长连接（推荐，无需公网IP）
    domain: "feishu"                     # 飞书域名标识

  wechat_official_account:               # 微信公众号
    enabled: false
    appId: "${WECHAT_APP_ID}"
    token: "${WECHAT_TOKEN}"

  dingtalk_bot:                          # 钉钉机器人
    enabled: false
    appKey: "${DINGTALK_APP_KEY}"
    appSecret: "${DINGTALK_APP_SECRET}"

  web_api:                               # 通用 HTTP API
    enabled: true                        # 默认启用 Web API
    authType: "bearer_token"             # bearer_token / api_key / none

# ========== 记忆管理 ==========
memory:
  type: "session_cache"                  # session_cache（会话级内存）/ persistent（持久化）/ none
  ttl: 3600                              # 会话有效期（秒）
  max_entries: 50                        # 最大记忆条目数

# ========== 输出格式 ==========
output:
  format: "markdown"                     # markdown / json / plain
  include_thought_trace: true            # 是否输出思考链
  include_confidence: true               # 是否输出置信度
